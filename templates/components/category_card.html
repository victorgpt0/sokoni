{% load static %}

<div class="group relative overflow-hidden rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
    <a href="{% url 'products:product_list' %}?category={{ category.slug }}" class="block">
        <!-- Category Card -->
        <div class="aspect-square bg-white border border-gray-200 flex flex-col items-center justify-center relative overflow-hidden">
            <!-- Background Pattern -->
            <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-primary/10"></div>

            <!-- Category Icon -->

                <div class="w-20 h-20 bg-gradient-to-br from-primary to-primary/80 rounded-full flex items-center justify-center shadow-lg transform group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
            </div> -->

            <!-- Category Name -->
            <div class="relative z-10 text-center px-4">
                <h3 class="text-lg font-bold text-gray-900 mb-2 leading-tight">
                    {{ category.name }}
                </h3>

                <!-- Product Count -->
                <div class="bg-gray-100 rounded-full px-3 py-1 inline-block">
                    <span class="text-sm font-medium text-gray-700">
                        {{ category.product_count }} products
                    </span>
                </div>
            </div>
        </div>

        <!-- Hover Overlay -->
        <div class="absolute inset-0 bg-gradient-to-br from-primary to-primary/90 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                    </svg>
                </div>
                <p class="text-lg font-bold mb-1">Shop {{ category.name }}</p>
