{% comment %}
Reusable authentication card component
Usage: {% include "components/auth_card.html" with title="Login" subtitle="Welcome back!" %}
{% endcomment %}

<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-primary via-purple-900 to-primary">
    <div class="max-w-md w-full space-y-8 relative">
        <!-- Animated background elements -->
        <div class="absolute -top-10 -left-10 w-20 h-20 bg-secondary/20 rounded-full animate-pulse"></div>
        <div class="absolute -bottom-10 -right-10 w-16 h-16 bg-secondary/30 rounded-full animate-bounce delay-1000"></div>

        <!-- Main card -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20 transform transition-all duration-500 hover:scale-105 hover:shadow-3xl">
            <!-- Header -->
            <div class="text-center animate-fade-in">
                <div class="mx-auto h-16 w-16 bg-secondary rounded-full flex items-center justify-center mb-4 transform transition-transform duration-300 hover:rotate-12">
                    <svg class="h-8 w-8 text-primary" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-white mb-2">{{ title }}</h2>
                {% if subtitle %}
                    <p class="text-secondary text-sm">{{ subtitle }}</p>
                {% endif %}
            </div>

            <!-- Content slot -->
            <div class="mt-8">
                {% block auth_content %}{% endblock %}
            </div>
        </div>
    </div>
</div>

<style>
@keyframes fade-in {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.animate-fade-in {
    animation: fade-in 0.6s ease-out;
}
</style>
