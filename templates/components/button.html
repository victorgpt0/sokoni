{% comment %}
Reusable button component
Usage: {% include "components/button.html" with text="Submit" type="submit" variant="primary" %}
Variants: primary, secondary, danger, success
{% endcomment %}

{% load static %}

{% with variant=variant|default:"primary" %}
<button 
    type="{{ type|default:'button' }}"
    {% if onclick %}onclick="{{ onclick }}"{% endif %}
    class="
        w-full px-6 py-3 rounded-lg font-medium text-sm transition-all duration-300 transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-opacity-50
        {% if variant == 'primary' %}
            bg-secondary text-primary hover:bg-secondary/90 focus:ring-secondary shadow-lg hover:shadow-xl
        {% elif variant == 'secondary' %}
            bg-white/20 text-white border border-white/30 hover:bg-white/30 focus:ring-white
        {% elif variant == 'danger' %}
            bg-red-500 text-white hover:bg-red-600 focus:ring-red-500 shadow-lg hover:shadow-xl
        {% elif variant == 'success' %}
            bg-green-500 text-white hover:bg-green-600 focus:ring-green-500 shadow-lg hover:shadow-xl
        {% endif %}
        disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none
        flex items-center justify-center space-x-2
    "
    {% if disabled %}disabled{% endif %}
>
    {% if loading %}
        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Loading...</span>
    {% else %}
        {% if icon %}
            <i class="{{ icon }}"></i>
        {% endif %}
        <span>{{ text }}</span>
    {% endif %}
</button>
{% endwith %}
