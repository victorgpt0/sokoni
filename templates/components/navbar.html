<header class="bg-secondary text-primary shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-2xl font-bold">Sokoni</a>
            
            <nav class="space-x-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:dashboard' %}" class="hover:text-primary">Dashboard</a>
                    <a href="{% url 'accounts:profile' %}" class="hover:text-primary">Profile</a>
                    <form action="{% url 'accounts:logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="hover:text-primary">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="hover:text-primary-500">Login</a>
                    <a href="{% url 'accounts:register' %}" class="hover:text-primary-500">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>
