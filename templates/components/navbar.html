<header class="bg-white text-gray-900 shadow-md">
    <div class="container mx-auto px-4 py-4">
        <!-- Top Navigation -->
        <div class="flex justify-between items-center mb-4">
            <a href="{% url 'home' %}" class="text-2xl font-bold text-primary">Sokoni</a>
            
            <!-- Search Bar (Mobile) -->
            <div class="md:hidden">
                <button class="text-gray-600 hover:text-primary">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>
            
            <!-- User Actions -->
            <div class="flex items-center space-x-4">
                <!-- Cart -->
                <a href="{% url 'cart:cart_detail' %}" class="relative text-gray-600 hover:text-primary">
                    <svg width="20px" height="20px" viewBox="0 0 32 32" id="svg5" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">

                        <defs id="defs2"/>
                        
                        <g id="layer1" transform="translate(-396,-196)">
                        
                        <path d="m 399,198.00586 c -0.55228,0 -1,0.44772 -1,1 0,0.55228 0.44772,1 1,1 h 1.18945 l 3.83203,18.20703 c 0.0979,0.46231 0.50597,0.79302 0.97852,0.79297 h 18.29883 c 0.55228,0 1,-0.44772 1,-1 0,-0.55228 -0.44772,-1 -1,-1 h -17.48828 l -0.42188,-2 h 16.91016 c 0.45916,1.8e-4 0.85946,-0.31232 0.9707,-0.75781 l 2.73047,-11 c 0.15748,-0.63123 -0.32012,-1.24241 -0.9707,-1.24219 H 418 v -3 c -6e-5,-0.55226 -0.44774,-0.99994 -1,-1 h -4 c -0.55226,6e-5 -0.99994,0.44774 -1,1 v 3 h -0.16016 l -0.87304,-3.25781 c -0.11206,-0.41878 -0.48115,-0.71768 -0.91407,-0.74024 -0.10463,-0.005 -0.20941,0.006 -0.31054,0.0332 l -3.86328,1.03515 c -0.53334,0.14303 -0.84983,0.69122 -0.70703,1.22461 l 0.45703,1.70508 h -2.97657 l -0.67382,-3.20508 C 401.88145,198.3377 401.47315,198.006 401,198.00586 Z m 15,2 h 2 v 2 h -2 z m -4.70703,0.22656 0.47461,1.77344 h -2.07031 L 407.36133,200.75 Z m -6.21875,3.77344 H 423.75 l -2.23242,9 -16.5332,0.004 c -0.61823,-2.86515 -1.2814,-6.02491 -1.91016,-9.00391 z" id="path39527" style="color:#000000;fill:#000000;fill-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:4.1;-inkscape-stroke:none"/>
                        
                        <path d="m 409,220.00586 c -1.64501,0 -3,1.35499 -3,3 0,1.64501 1.35499,3 3,3 1.64501,0 3,-1.35499 3,-3 0,-1.64501 -1.35499,-3 -3,-3 z m 0,2 c 0.56413,0 1,0.43587 1,1 0,0.56413 -0.43587,1 -1,1 -0.56413,0 -1,-0.43587 -1,-1 0,-0.56413 0.43587,-1 1,-1 z" id="circle39529" style="color:#000000;fill:#000000;fill-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:4.1;-inkscape-stroke:none"/>
                        
                        <path d="m 419,220.00586 c -1.64501,0 -3,1.35499 -3,3 0,1.64501 1.35499,3 3,3 1.64501,0 3,-1.35499 3,-3 0,-1.64501 -1.35499,-3 -3,-3 z m 0,2 c 0.56413,0 1,0.43587 1,1 0,0.56413 -0.43587,1 -1,1 -0.56413,0 -1,-0.43587 -1,-1 0,-0.56413 0.43587,-1 1,-1 z" id="circle39531" style="color:#000000;fill:#000000;fill-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:4.1;-inkscape-stroke:none"/>
                        
                        </g>
                        
                        </svg>
                    {% if cart_count %}
                        <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center" data-cart-count="{{ cart_count }}">
                            {{ cart_count }}
                        </span>
                    {% endif %}
                </a>
                
                <!-- User Menu -->
                {% if user.is_authenticated %}
                    <div class="relative group">
                        <button class="flex items-center space-x-1 text-gray-600 hover:text-primary">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <span class="hidden md:block">{{ user.first_name|default:user.username }}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        
                        <!-- Dropdown Menu -->
                        <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
                            <a href="{% url 'accounts:dashboard' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Dashboard</a>
                            <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="{% url 'products:my_products' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">My Products</a>
                            <a href="{% url 'accounts:order_history' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">My Orders</a>
                            <a href="{% url 'accounts:address_list' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Addresses</a>
                            <hr class="my-1">
                            <form action="{% url 'accounts:logout' %}" method="post" class="block">
                                {% csrf_token %}
                                <button type="submit" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</button>
                            </form>
                        </div>
                    </div>
                {% else %}
                    <div class="flex items-center space-x-2">
                        <a href="{% url 'accounts:login' %}" class="text-gray-600 hover:text-primary">Login</a>
                        <span class="text-gray-400">|</span>
                        <a href="{% url 'accounts:register' %}" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors duration-200">Register</a>
                    </div>
                {% endif %}
            </div>
        </div>
        
        <!-- Main Navigation -->
        <nav class="hidden md:flex items-center justify-between">
            <!-- Categories -->
            <div class="flex items-center space-x-6">
                <a href="{% url 'products:product_list' %}" class="text-gray-600 hover:text-primary font-medium">All Products</a>
                <a href="{% url 'products:product_list' %}?category=electronics" class="text-gray-600 hover:text-primary">Electronics</a>
                <a href="{% url 'products:product_list' %}?category=fashion" class="text-gray-600 hover:text-primary">Fashion</a>
                <a href="{% url 'products:product_list' %}?category=home-garden" class="text-gray-600 hover:text-primary">Home & Garden</a>
                <a href="{% url 'products:product_list' %}?category=sports" class="text-gray-600 hover:text-primary">Sports</a>
            </div>
            
            <!-- Search Bar (Desktop) -->
            <div class="flex-1 max-w-md mx-8">
                <form action="{% url 'products:product_list' %}" method="GET" class="relative">
                    <input type="text" 
                           name="search" 
                           placeholder="Search products..."
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                    <button type="submit" class="absolute right-2 top-2 text-gray-400 hover:text-primary">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                </form>
            </div>
            
            <!-- Additional Links -->
            <div class="flex items-center space-x-4">
                <a href="#" class="text-gray-600 hover:text-primary text-sm">Deals</a>
                <a href="#" class="text-gray-600 hover:text-primary text-sm">Help</a>
            </div>
        </nav>
    </div>
</header>
