name: Enforce staging → main PRs

on:
  pull_request:
    branches: [ main ]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "❌ Pull requests into main must come from staging!"
            exit 1
          fi