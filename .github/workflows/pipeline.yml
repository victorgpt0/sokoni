  deploy:
  
    name: Deploy to AWS ECS using Terraform
    runs-on: ubuntu-latest
    # needs: build
    permissions: 
      id-token: write
      contents: read
    env:
      TF_CLOUD_ORGANIZATION: victorgpt0
      TF_WORKSPACE: sokoni-staging
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      CONFIG_DIRECTORY: ./.github/infra/staging

    steps:
      
      - name: Checkout
        uses: actions/checkout@v5

      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
      #     aws-region: us-east-1

      - name: Upload Configuration to Terraform Cloud
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
        id: plan-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true

      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v1

      - name: Create Plan Run
        uses: hashicorp/tfc-workflows-github/actions/create-plan-run@v1.0.0
        id: plan-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan-only: true

      # - name: Terraform Init & Apply
      #   env:
      #     VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      #     VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      #   run: |
      #     cd .github/infra/staging
      #     terraform init
      #     terraform plan -var="container_image=418272801832.dkr.ecr.us-east-1.amazonaws.com/victor/sokoni:development-latest" \
      #       -input=false
      #     terraform validate
      #     terraform apply -auto-approve -input=false

      - name: Get Plan Output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.0.0
        with:
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}