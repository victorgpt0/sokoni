  deploy:
  
    name: Deploy to AWS ECS using Terraform
    runs-on: ubuntu-latest
    # needs: build
    permissions: 
      id-token: write
      contents: read

    steps:
      
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Navigate to Infra Directory
        run: cd .github/infra/staging

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform plan
          terraform validate
          terraform apply -auto-approve \
            -var="container_image=418272801832.dkr.ecr.us-east-1.amazonaws.com/victor/sokoni:development-latest" \
            -var="vault_addr=${{ secrets.VAULT_ADDR }}" \
            -var="vault_token=${{ secrets.VAULT_TOKEN }}"