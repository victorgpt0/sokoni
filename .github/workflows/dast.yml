name: DAST Scan
run-name: Dynamic App Security Testing on Sokoni 🧿
on:
  push:
    branches: [ main, staging, development ]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule: 
    - cron: '0 0 * * 0'

jobs:

  zap: 
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }} -t ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}-latest .

      - name: Run Container
        run: |
          docker run \
            -e DATABASE_URL=${{ secrets.TEST_DB_URL }} \
            --rm ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }} 
        
      - name: Wait for Application to be Ready
        run: |
          echo "Waiting for application to be ready..."
          sleep 30

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.6.0
        with:
          target: 'http://localhost:8000'
          cmd_options: '-r zap_report.html'
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: 'zap_report.html'