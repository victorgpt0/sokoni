name: DAST Scan
run-name: Dynamic App Security Testing on Sokoni 🧿
on:
  push:
    branches: [ main, staging ]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 0'

jobs:

  zap:
    permissions:
      contents: read
      issues: write

    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make SAFE_REF
        run: |
          echo "SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '.' '-')" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ env.SAFE_REF }}-${{ github.sha }} -t ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ env.SAFE_REF }}-latest .

      - name: Run Container
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
        run: |
          docker run -d \
            --name sokoni-app \
            -e DATABASE_URL="$TEST_DB_URL" \
            -p 8000:8000 \
            --name sokoni-app \
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ env.SAFE_REF }}-${{ github.sha }}

          docker exec sokoni-app python manage.py migrate --noinput

      - name: Wait for App to be Ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Up!"
              exit 0
            fi
            echo "Waiting..."
            sleep 5
          done
          echo ""Failed to start" >&2
          docker logs sokoni-app
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8000'
          cmd_options: '-r zap_report.html -w zap_warnings.md -J zap_report.json'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap_report.html
            zap_warnings.md
            zap_report.json

      - name: Stop Django Container
        if: always()
        run: |
          docker stop sokoni-app
          docker rm sokoni-app
